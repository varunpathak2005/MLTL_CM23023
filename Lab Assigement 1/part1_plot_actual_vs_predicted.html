<!DOCTYPE html>
<html>
<head>
  <title>Linear Regression – Actual vs Predicted</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
</head>
<body>

<h2>Actual vs Predicted Values</h2>
<button onclick="run()">Train & Plot</button>

<script>
let model, xs, ys, preds;

async function run() {

  xs = tf.tensor2d([1,2,3,4,5,6,7,8], [8,1]);
  ys = tf.tensor2d([3,5,7,9,11,13,15,17], [8,1]);

  model = tf.sequential();
  model.add(tf.layers.dense({ units: 1, inputShape: [1] }));

  model.compile({
    optimizer: tf.train.sgd(0.01),   // 🔥 FIX
    loss: 'meanSquaredError'
  });

  await model.fit(xs, ys, {
    epochs: 200
  });

  preds = model.predict(xs);

  console.log("Training done");
}
</script>



<p>👉 Open Console (F12) to see output</p>

</body>
</html>
