<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Linear Regression with Synthetic Data</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
</head>
<body>
    <h2>Linear Regression with Synthetic Data</h2>
    <button onclick="trainModel()">Train Model</button>
    <p>Open <b>Console (F12)</b> to see loss and predictions</p>

    <script>
        let model, xs, ys;

        function generateData() {
            xs = tf.tensor1d([1,2,3,4,5]);
            ys = tf.tensor1d([3,5,7,9,11]); // y = 2x + 1
            console.log("Synthetic data created");
        }

        function createModel() {
            model = tf.sequential();
            model.add(tf.layers.dense({ units: 1, inputShape: [1] }));
            model.compile({ optimizer: tf.train.sgd(0.1), loss: 'meanSquaredError' });
            console.log("Model created");
        }

        async function trainModel() {
            generateData();
            createModel();
            console.log("Training started...");
            await model.fit(xs, ys, {
                epochs: 50,
                callbacks: {
                    onEpochEnd: (epoch, logs) => {
                        console.log(`Epoch ${epoch+1} → Loss: ${logs.loss}`);
                    }
                }
            });
            console.log("Training completed");
        }

        function predictValue(input=6) {
            if(!model) return console.log("Train the model first!");
            const pred = model.predict(tf.tensor2d([input],[1,1]));
            pred.print();
        }
    </script>
</body>
</html>
