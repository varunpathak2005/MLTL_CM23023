<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Linear Regression with Synthetic Data</title>

    <!-- TensorFlow.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
</head>
<body>
    <h2>Linear Regression with Synthetic Data (TF.js)</h2>

    <button onclick="trainModel()">Train Model</button>
    <button onclick="predictValue()">Predict (Console)</button>

    <p>👉 Open <b>Console (F12)</b> to see output</p>

    <script>
        let model;
        let xs, ys;

        // 1️⃣ Generate synthetic data
        function generateData() {
            xs = tf.tensor1d([1, 2, 3, 4, 5]);
            ys = tf.tensor1d([3, 5, 7, 9, 11]); // y = 2x + 1
            console.log("Synthetic data created");
        }

        // 2️⃣ Create model
        function createModel() {
            model = tf.sequential();
            model.add(tf.layers.dense({ units: 1, inputShape: [1] }));

            model.compile({
                optimizer: tf.train.sgd(0.1),
                loss: 'meanSquaredError'
            });

            console.log("Model created");
        }

        // 3️⃣ Train model
        async function trainModel() {
            generateData();
            createModel();

            console.log("Training started...");

            await model.fit(xs, ys, {
                epochs: 50,
                callbacks: {
                    onEpochEnd: (epoch, logs) => {
                        console.log(`Epoch ${epoch + 1} → Loss: ${logs.loss}`);
                    }
                }
            });

            console.log("Training completed");
        }

        // 4️⃣ Predict value (manual)
        function predictValue() {
            if (!model) {
                console.log("Train the model first!");
                return;
            }

            const input = tf.tensor2d([6], [1, 1]);
            const prediction = model.predict(input);

            prediction.print();
        }
    </script>
</body>
</html>
