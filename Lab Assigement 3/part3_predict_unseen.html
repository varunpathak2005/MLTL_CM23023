<!DOCTYPE html>
<html>
<head>
  <title>Predict Unseen Values</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
</head>
<body>

<h2>Prediction for Unseen Inputs</h2>
<button onclick="predict()">Predict</button>

<script>
let model, xs, ys, unseenX, predictions;

async function predict() {

  xs = tf.tensor2d([1,2,3,4,5], [5,1]);
  ys = tf.tensor2d([3,5,7,9,11], [5,1]);

  model = tf.sequential();
  model.add(tf.layers.dense({ units:1, inputShape:[1] }));

  model.compile({
    optimizer: tf.train.sgd(0.01),
    loss: 'meanSquaredError'
  });

  await model.fit(xs, ys, { epochs:200 });

  // 🔥 Make unseenX global
  unseenX = tf.tensor2d([6, 7, 10], [3,1]);
  predictions = model.predict(unseenX);

  console.log("Prediction completed");
}
</script>


<p>👉 Expected output ≈ y = 2x + 1</p>

</body>
</html>
