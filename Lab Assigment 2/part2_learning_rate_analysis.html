<!DOCTYPE html>
<html>
<head>
  <title>Learning Rate Analysis</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
</head>
<body>

<h2>Learning Rate Experiment</h2>
<button onclick="testLR(0.01)">LR = 0.01</button>
<button onclick="testLR(0.1)">LR = 0.1</button>
<button onclick="testLR(1)">LR = 1.0</button>

<script>
async function testLR(lr) {

  const xs = tf.tensor1d([1,2,3,4,5]);
  const ys = tf.tensor1d([3,5,7,9,11]);

  const model = tf.sequential();
  model.add(tf.layers.dense({units:1, inputShape:[1]}));

  model.compile({
    optimizer: tf.train.sgd(lr),
    loss: 'meanSquaredError'
  });

  console.log("Training with learning rate:", lr);

  await model.fit(xs, ys, {
    epochs:50,
    callbacks: {
      onEpochEnd: (epoch, logs) => {
        console.log(`Epoch ${epoch} | Loss: ${logs.loss}`);
      }
    }
  });
}
</script>

<p>👉 Check Console for loss values</p>

</body>
</html>
